server:
  # El puerto 8083 es el que definimos en el Gateway para la ruta-ms3
  port: ${PORT:8083}

spring:
  application:
    name: orders-service # El nombre oficial

  datasource:
    # Apunta al puerto 5435 exclusivo de la base de datos de órdenes
    url: ${DB_URL:jdbc:postgresql://localhost:5435/orders_db}
    username: ${DB_USER:user_orders}
    password: ${DB_PASS:password_orders}

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
